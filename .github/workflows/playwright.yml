
name: Playwright CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ==========================================
  # CI: Validate and run Playwright tests
  # ==========================================
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: warn

  # ==========================================
  # CD: Deploy report to GitHub Pages
  # ==========================================
  deploy:
    name: Deploy Playwright Report
    runs-on: ubuntu-latest
    needs: test

    if: >-
      ${{
        always() &&
        needs.test.result != 'cancelled' &&
        github.event_name != 'pull_request' &&
        github.ref == 'refs/heads/main'
      }}

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - name: Download Playwright report
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Check report availability
        id: report
        shell: bash
        run: |
          if [ -f "playwright-report/index.html" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Playwright report found."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No Playwright report available."
          fi

      - name: Setup GitHub Pages
        if: steps.report.outputs.available == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.report.outputs.available == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/

      - name: Deploy to GitHub Pages
        if: steps.report.outputs.available == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show Playwright Report URL
        if: steps.deployment.outcome == 'success'
        shell: bash
        env:
          REPORT_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "## Playwright HTML Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[View Playwright Report]($REPORT_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Report URL: $REPORT_URL" >> "$GITHUB_STEP_SUMMARY"
